<style>
:root {
    --black: #060606;
    --header: #242424;
    --green: #86bc25;
    --teal: #35b8b0;
    --land: #aeb7bf;
    --land-hover: #9da8b1;
    --border: #8c969f;
    --red: #e0202f;
    --blue: #4a90c2;
    --text: #101820;
    --muted: #5f6b76;
    --white: #ffffff;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #f4f5f6;
    font-family: Aptos, "Segoe UI", Arial, sans-serif;
    color: var(--text);
}

.page {
    width: min(1500px, calc(100% - 48px));
    margin: 28px auto;
    background: var(--white);
    border: 1px solid #d9dee4;
    box-shadow: 0 14px 34px rgba(0,0,0,0.14);
}

/* Header */
.header {
    background: var(--header);
    color: var(--white);
    min-height: 118px;
    padding: 28px 38px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    border-bottom: 4px solid var(--green);
}

.header h1 {
    font-size: 34px;
    font-weight: 600;
    letter-spacing: -0.8px;
}

.header p {
    margin-top: 8px;
    font-size: 15px;
    font-weight: 400;
    color: #c8d0d8;
}

.header button {
    height: 42px;
    padding: 0 22px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.34);
    background: transparent;
    color: var(--white);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
}

.header button:hover {
    border-color: var(--green);
    color: var(--green);
}

/* Controls */
.controls {
    background: var(--black);
    padding: 22px 38px 24px;
    border-bottom: 4px solid var(--green);
}

.metric-row {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin-bottom: 22px;
}

.metric {
    height: 42px;
    border: 1px solid #252a2e;
    background: var(--teal);
    color: #ffffff;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
}

.metric.active {
    background: #333333;
    border-color: var(--green);
    box-shadow: inset 0 -3px 0 var(--green);
}

.filter-row {
    display: grid;
    grid-template-columns: 180px 220px 220px 220px 1fr;
    gap: 22px;
    align-items: end;
}

.filter label {
    display: block;
    margin-bottom: 8px;
    color: #f1f4f6;
    font-size: 13px;
    font-weight: 500;
}

.filter select {
    width: 100%;
    height: 44px;
    background: #ffffff;
    border: 1px solid #cfd5da;
    border-radius: 3px;
    color: #19232d;
    font-size: 14px;
    font-weight: 400;
    padding: 0 12px;
}

.source {
    justify-self: end;
    height: 38px;
    min-width: 235px;
    padding: 0 18px;
    border-radius: 999px;
    background: rgba(134,188,37,0.14);
    color: #d8eea0;
    border: 1px solid rgba(134,188,37,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 500;
}

/* Map block */
.map-header {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: start;
    gap: 20px;
    padding: 26px 38px 8px;
    background: #ffffff;
}

.map-header h2 {
    font-size: 23px;
    font-weight: 600;
    letter-spacing: -0.4px;
    color: #101820;
}
